name: Deploy Next.js Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 20.x
  DEPLOY_PORT: 3018
  APP_NAME: metronic-react-concepts
  APP_URL: https://keenthemes.com/metronic/concepts/nextjs/
  BASE_PATH: /metronic/concepts/nextjs

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /var/www/metronic/metronic-react-concepts/typescript/nextjs

            # Pull latest changes
            git reset --hard && git pull

            # Install dependencies
            npm ci -f || npm i -f

            # Create .env.production file with base path
            echo "NEXT_PUBLIC_BASE_PATH=${{ env.BASE_PATH }}" > .env.production

            # Debug: Show contents of created .env.production file
            echo "=== Created .env.production Contents ==="
            cat .env.production
            echo "========================================"

            # Build application on server with environment variable
            export NEXT_PUBLIC_BASE_PATH="${{ env.BASE_PATH }}"
            npm run build

            # Restart application
            export PORT=${{ env.DEPLOY_PORT }}
            pm2 restart "${{ env.APP_NAME }}" --update-env || pm2 start npm --name "${{ env.APP_NAME }}" -- start

      - name: Deployment status
        run: |
          echo "✅ Deployment completed successfully"
          echo "🌐 Environment is available at: ${{ env.APP_URL }}"
