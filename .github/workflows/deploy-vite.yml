name: Deploy Vite to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: typescript/vite/package-lock.json

    - name: Install dependencies
      working-directory: typescript/vite
      run: npm ci --force || npm install --force

    - name: Set production base URL
      working-directory: typescript/vite
      run: echo "VITE_BASE_URL=/metronic/concepts/vite/" > .env.production

    - name: Build application
      working-directory: typescript/vite
      env:
        VITE_BASE_URL: /metronic/concepts/vite/
      run: npm run build

    - name: Deploy to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "typescript/vite/dist/*"
        target: /var/www/metronic/metronic-react-concepts/typescript/vite
        strip_components: 3
        overwrite: true